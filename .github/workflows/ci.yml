name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test-train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.7"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Unit tests
        run: pytest -q

      - name: Training smoke run
        run: python -m ml.train --out-dir artifacts --no-mlflow

      - name: Upload model + metrics
        uses: actions/upload-artifact@v4
        with:
          name: model-${{ github.sha }}
          path: artifacts/
          retention-days: 14

  docker-smoke:
    needs: lint-test-train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t diabetes-triage:ci .

      - name: Run container
        run: docker run -d --name app -p 80:80 diabetes-triage:ci

      - name: Smoke test endpoints
        run: |
          expected=$(python3 -c 'from ml.config import MODEL_VERSION; print(MODEL_VERSION)')
          bash scripts/smoke.sh "$expected"
          docker image ls diabetes-triage:ci --format 'Image size: {{.Size}}'

      - name: Container logs on failure
        if: failure()
        run: docker logs app
