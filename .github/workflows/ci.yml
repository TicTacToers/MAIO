name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test-train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.7"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Unit tests
        run: pytest -q

      - name: Training smoke run
        run: python -m ml.train --out-dir artifacts --no-mlflow

      - name: Upload model + metrics
        uses: actions/upload-artifact@v4
        with:
          name: model-${{ github.sha }}
          path: artifacts/
          retention-days: 14

  docker-smoke:
    needs: lint-test-train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t diabetes-triage:ci .

      - name: Run container
        run: docker run -d --name app -p 80:80 diabetes-triage:ci

      - name: Smoke test endpoints
        run: |
          for i in $(seq 1 20); do curl -sf http://localhost:80/health && break; sleep 1; done
          curl -sf http://localhost:80/health | grep -q '"status":"ok"'
          expected=$(python3 -c 'from ml.config import MODEL_VERSION; print(MODEL_VERSION)')
          actual=$(curl -sf http://localhost:80/health | jq -r .model_version)
          echo "model_version: expected=$expected actual=$actual"
          test "$actual" = "$expected"
          curl -sf -X POST http://localhost:80/predict -H "Content-Type: application/json" \
            -d '{"age":0.02,"sex":-0.044,"bmi":0.06,"bp":-0.03,"s1":-0.02,"s2":0.03,"s3":-0.02,"s4":0.02,"s5":0.02,"s6":-0.001}' \
            | grep -q '"prediction"'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:80/predict \
            -H "Content-Type: application/json" -d '{"age":0.02}')
          test "$code" = "422"
          docker image ls diabetes-triage:ci --format 'Image size: {{.Size}}'

      - name: Container logs on failure
        if: failure()
        run: docker logs app
